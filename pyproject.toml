[project]
name = "bolty-switch-backend"
version = "0.6.6"
description = "Backend Python para Bolty Switch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Zazen AI Studio" }]
license = { file = "LICENSE" }
dependencies = [
  "psutil>=6.1,<8",
  "rapidfuzz>=3.10,<4",
  "vosk>=0.3.45,<0.4",
  "sounddevice>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["frontend/dist", "frontend/src-tauri/target", "build", "dist"]
